name: bot

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 */6 * * *"   # new dev fact once a day, activity every 6 hours
  push:
    branches: [main]
    paths: [".github/scripts/**", "data/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# one move at a time, so two quick moves never race on the push
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  play:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, 'quiz:') ||
      startsWith(github.event.issue.title, 'word:') ||
      startsWith(github.event.issue.title, 'ttt:') ||
      startsWith(github.event.issue.title, 'vote:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play move or refresh
        id: bot
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'issues' && 'event' || (github.event_name == 'push' && 'render' || 'cron') }}
        run: python .github/scripts/bot.py "$MODE"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets state
          if ! git diff --cached --quiet; then
            git commit -q -m "bot: update profile"
            git pull -q --rebase
            git push -q
          fi

      - name: Reply and close
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.bot.outputs.message }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
