name: poll

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# one vote at a time, so two quick votes never race on the push
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  vote:
    if: startsWith(github.event.issue.title, 'vote:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count vote
        id: count
        run: python .github/scripts/poll.py

      - name: Commit tally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md poll/poll.json
          if ! git diff --cached --quiet; then
            git commit -m "poll: update tally"
            git pull --rebase
            git push
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.count.outputs.message }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
